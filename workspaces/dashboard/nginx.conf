server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Serve JSON data files with CORS
    location /data/ {
        add_header Access-Control-Allow-Origin *;
        default_type application/json;
        try_files $uri =404;
    }

    # Serve markdown docs as plain text
    location /docs/ {
        add_header Access-Control-Allow-Origin *;
        default_type text/plain;
        try_files $uri =404;
    }

    # Override content type for YAML files
    location ~* \.ya?ml$ {
        default_type text/plain;
        try_files $uri =404;
    }

    # Health check
    location /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
