<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lido DevNet Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
    };
  </script>
  <style>
    .copy-btn:hover { opacity: 1; }
    .copy-btn { opacity: 0.5; cursor: pointer; transition: opacity 0.2s; }
    .tab-active { border-bottom: 2px solid #3b82f6; color: #3b82f6; }
    .dark .tab-active { border-bottom-color: #60a5fa; color: #60a5fa; }

    /* Prose (markdown) */
    .prose a { color: #3b82f6; text-decoration: underline; }
    .prose code { background: #f3f4f6; padding: 2px 6px; border-radius: 4px; font-size: 0.875em; }
    .prose pre { background: #1f2937; color: #e5e7eb; padding: 16px; border-radius: 8px; overflow-x: auto; }
    .prose pre code { background: none; padding: 0; color: inherit; }
    .prose h1 { font-size: 1.5em; font-weight: 700; margin: 1em 0 0.5em; }
    .prose h2 { font-size: 1.25em; font-weight: 600; margin: 1em 0 0.5em; border-bottom: 1px solid #e5e7eb; padding-bottom: 0.3em; }
    .prose h3 { font-size: 1.1em; font-weight: 600; margin: 0.8em 0 0.4em; }
    .prose ul { list-style: disc; padding-left: 1.5em; margin: 0.5em 0; }
    .prose ol { list-style: decimal; padding-left: 1.5em; margin: 0.5em 0; }
    .prose li { margin: 0.25em 0; }
    .prose p { margin: 0.5em 0; }
    .prose table { border-collapse: collapse; width: 100%; margin: 1em 0; }
    .prose th, .prose td { border: 1px solid #d1d5db; padding: 8px 12px; text-align: left; }
    .prose th { background: #f9fafb; font-weight: 600; }

    /* Dark prose overrides */
    .dark .prose a { color: #60a5fa; }
    .dark .prose code { background: #374151; color: #e5e7eb; }
    .dark .prose pre { background: #111827; }
    .dark .prose h2 { border-bottom-color: #374151; }
    .dark .prose th, .dark .prose td { border-color: #4b5563; }
    .dark .prose th { background: #1f2937; }

    .doc-link { cursor: pointer; }
    .doc-link:hover { background: #eff6ff; }
    .doc-link-active { background: #eff6ff; color: #2563eb; font-weight: 500; }
    .dark .doc-link:hover { background: #1e3a5f; }
    .dark .doc-link-active { background: #1e3a5f; color: #60a5fa; }
  </style>
</head>
<body class="bg-gray-50 text-gray-900 dark:bg-gray-950 dark:text-gray-100 min-h-screen transition-colors">
  <div class="max-w-7xl mx-auto">
    <!-- Top nav -->
    <nav class="bg-white dark:bg-gray-900 border-b border-gray-200 dark:border-gray-700 px-6 py-3 flex items-center gap-6">
      <div class="font-bold text-lg text-blue-600 dark:text-blue-400">Lido DevNet</div>
      <div class="flex gap-1" id="tabs">
        <button onclick="showTab('status')" class="px-4 py-2 text-sm font-medium tab-active" id="tab-status">Status</button>
        <button onclick="showTab('docs')" class="px-4 py-2 text-sm font-medium text-gray-600 dark:text-gray-400" id="tab-docs">Docs</button>
        <button onclick="showTab('downloads')" class="px-4 py-2 text-sm font-medium text-gray-600 dark:text-gray-400" id="tab-downloads">Downloads</button>
      </div>
      <div class="ml-auto flex items-center gap-3">
        <span class="text-xs text-gray-400" id="build-time"></span>
        <button onclick="toggleTheme()" id="theme-toggle" class="p-1.5 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors" title="Toggle dark mode">
          <svg id="icon-sun" class="w-5 h-5 hidden dark:block text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>
          </svg>
          <svg id="icon-moon" class="w-5 h-5 block dark:hidden text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
          </svg>
        </button>
      </div>
    </nav>

    <!-- Loading -->
    <div id="loading" class="text-center py-20 text-gray-500">Loading devnet state...</div>
    <div id="error" class="hidden text-center py-20 text-red-600 dark:text-red-400"></div>

    <!-- Status page -->
    <div id="page-status" class="hidden p-6 space-y-6"></div>

    <!-- Docs page -->
    <div id="page-docs" class="hidden flex" style="min-height: calc(100vh - 57px);">
      <div class="w-64 bg-white dark:bg-gray-900 border-r border-gray-200 dark:border-gray-700 p-4 overflow-y-auto" id="docs-sidebar"></div>
      <div class="flex-1 p-6 prose max-w-none overflow-y-auto" id="docs-content">
        <p class="text-gray-500">Select a document from the sidebar.</p>
      </div>
    </div>

    <!-- Downloads page -->
    <div id="page-downloads" class="hidden p-6"></div>
  </div>

<script>
let STATE = null;
let MANIFEST = null;

// ── Theme ──────────────────────────────────────────────────────────────

function getTheme() {
  return localStorage.getItem('dashboard-theme') || 'light';
}

function applyTheme(theme) {
  if (theme === 'dark') {
    document.documentElement.classList.add('dark');
  } else {
    document.documentElement.classList.remove('dark');
  }
}

function toggleTheme() {
  const next = getTheme() === 'dark' ? 'light' : 'dark';
  localStorage.setItem('dashboard-theme', next);
  applyTheme(next);
  // Re-render if data loaded (updates card/row colors)
  if (STATE) {
    renderStatus(STATE);
    renderDownloads(MANIFEST);
  }
}

applyTheme(getTheme());

// ── Tab navigation ──────────────────────────────────────────────────────

function showTab(name) {
  document.querySelectorAll('[id^="page-"]').forEach(el => el.classList.add('hidden'));
  document.querySelectorAll('#tabs button').forEach(btn => {
    btn.classList.remove('tab-active');
    btn.classList.add('text-gray-600', 'dark:text-gray-400');
  });
  document.getElementById('page-' + name).classList.remove('hidden');
  const activeBtn = document.getElementById('tab-' + name);
  activeBtn.classList.add('tab-active');
  activeBtn.classList.remove('text-gray-600', 'dark:text-gray-400');
}

// ── Utilities ───────────────────────────────────────────────────────────

function str(value) {
  if (value === null || value === undefined) return '';
  if (typeof value === 'string') return value;
  if (typeof value === 'object') return JSON.stringify(value);
  return String(value);
}

function escapeAttr(s) {
  return s.replace(/&/g,'&amp;').replace(/'/g,'&#39;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function copyToClipboard(text, btn) {
  navigator.clipboard.writeText(text).then(() => {
    const orig = btn.textContent;
    btn.textContent = 'Copied!';
    setTimeout(() => btn.textContent = orig, 1500);
  });
}

function linkOrText(value) {
  const s = str(value);
  if (!s) return '<span class="text-gray-400 dark:text-gray-600">-</span>';
  if (s.startsWith('http://') || s.startsWith('https://') || s.startsWith('ws://')) {
    return `<a href="${escapeAttr(s)}" target="_blank" class="text-blue-600 dark:text-blue-400 hover:underline break-all">${s}</a>`;
  }
  return `<span class="font-mono text-sm break-all">${s}</span>`;
}

function card(title, content) {
  return `<div class="bg-white dark:bg-gray-900 rounded-lg shadow-sm border border-gray-200 dark:border-gray-700 p-5">
    <h3 class="text-sm font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wide mb-3">${title}</h3>
    ${content}
  </div>`;
}

function kvRow(key, value, copyable = false) {
  const s = str(value);
  const copyBtn = copyable && s
    ? ` <button class="copy-btn text-xs text-blue-500 dark:text-blue-400 ml-2" onclick="copyToClipboard('${escapeAttr(s)}', this)">copy</button>`
    : '';
  return `<div class="flex items-start py-1.5 border-b border-gray-50 dark:border-gray-800 last:border-0">
    <span class="text-gray-500 dark:text-gray-400 text-sm w-48 flex-shrink-0">${key}</span>
    <span class="text-sm flex-1">${linkOrText(s)}${copyBtn}</span>
  </div>`;
}

// ── Status page rendering ───────────────────────────────────────────────

function renderStatus(state) {
  const page = document.getElementById('page-status');
  let html = '';

  // Header
  const chainMode = state.chainMode || 'unknown';
  html += `<div class="bg-gradient-to-r from-blue-600 to-blue-800 dark:from-blue-800 dark:to-blue-950 rounded-lg p-6 text-white">
    <h1 class="text-2xl font-bold mb-1">DevNet Dashboard</h1>
    <p class="text-blue-200">Chain mode: <span class="text-white font-medium">${chainMode}</span></p>
  </div>`;

  // Chain endpoints
  if (state.chain) {
    const c = state.chain;
    html += card('Chain Endpoints', `
      ${kvRow('EL Client', c.elClientType)}
      ${kvRow('EL Public', c.elPublic, true)}
      ${kvRow('EL Private', c.elPrivate, true)}
      ${kvRow('EL WS Public', c.elWsPublic, true)}
      ${kvRow('EL WS Private', c.elWsPrivate, true)}
      ${kvRow('CL Public', c.clPublic, true)}
      ${kvRow('CL Private', c.clPrivate, true)}
      ${c.vcClientType ? kvRow('VC Client', c.vcClientType) : ''}
      ${c.validatorsApiPublic ? kvRow('Validators API', c.validatorsApiPublic, true) : ''}
    `);
  }

  // Node ingress
  if (state.nodesIngress) {
    const ni = state.nodesIngress;
    let rows = '';
    if (ni.el) ni.el.forEach((n, i) => rows += kvRow(`EL ${i}`, n.publicIngressUrl, true));
    if (ni.cl) ni.cl.forEach((n, i) => rows += kvRow(`CL ${i}`, n.publicIngressUrl, true));
    if (ni.vc) ni.vc.forEach((n, i) => rows += kvRow(`VC ${i}`, n.publicIngressUrl, true));
    if (rows) html += card('Node Ingress URLs', rows);
  }

  // Services
  {
    let rows = '';
    if (state.kapiK8s?.running?.publicUrl) rows += kvRow('Keys API', state.kapiK8s.running.publicUrl, true);
    if (state.noWidget?.running?.publicUrl) rows += kvRow('NO Widget', state.noWidget.running.publicUrl, true);
    if (state.dashboard?.running?.publicUrl) rows += kvRow('Dashboard', state.dashboard.running.publicUrl, true);
    if (state.evm?.running?.publicUrl) rows += kvRow('EVM', state.evm.running.publicUrl, true);
    if (rows) html += card('Services', rows);
  }

  // Explorers & monitoring
  {
    let rows = '';
    if (state.dora?.publicUrl) rows += kvRow('Dora', state.dora.publicUrl, true);
    if (state.blockscout?.url) rows += kvRow('Blockscout', state.blockscout.url, true);
    if (state.blockscout?.api) rows += kvRow('Blockscout API', state.blockscout.api, true);
    if (state.grafana?.publicUrl) rows += kvRow('Grafana', state.grafana.publicUrl, true);
    if (rows) html += card('Explorers & Monitoring', rows);
  }

  // Lido Core contracts
  if (state.lidoCore) {
    const lido = state.lidoCore;
    const importantKeys = [
      'lidoLocator', 'lido', 'stakingRouter', 'accountingOracle',
      'depositSecurityModule', 'withdrawalQueue', 'curatedModule',
      'agent', 'voting', 'tokenManager', 'finance',
    ];
    let rows = '';
    for (const key of importantKeys) {
      if (lido[key]) {
        const raw = lido[key];
        const addr = typeof raw === 'object' ? (raw.proxy || raw.address || JSON.stringify(raw)) : raw;
        rows += kvRow(key, addr, true);
      }
    }
    const allKeys = Object.keys(lido).filter(k => !importantKeys.includes(k) && k !== 'chainId' && k !== 'chainSpec');
    if (allKeys.length > 0) {
      rows += `<div class="text-xs text-gray-400 dark:text-gray-500 mt-2">+ ${allKeys.length} more contracts (download state.json for full list)</div>`;
    }
    if (rows) html += card('Lido Core Contracts', rows);
  }

  // CSM contracts
  if (state.csm) {
    let rows = '';
    for (const [key, val] of Object.entries(state.csm)) {
      if (typeof val === 'string' && val.startsWith('0x')) {
        rows += kvRow(key, val, true);
      }
    }
    if (rows) html += card('CSM Contracts', rows);
  }

  // CMv2 contracts
  if (state.cmv2) {
    let rows = '';
    for (const [key, val] of Object.entries(state.cmv2)) {
      if (typeof val === 'string' && val.startsWith('0x')) {
        rows += kvRow(key, val, true);
      }
    }
    if (rows) html += card('CMv2 Contracts', rows);
  }

  page.innerHTML = html;
}

// ── Docs page rendering ─────────────────────────────────────────────────

function renderDocsSidebar(manifest) {
  const sidebar = document.getElementById('docs-sidebar');
  const docs = manifest.docs || [];
  if (docs.length === 0) {
    sidebar.innerHTML = '<p class="text-gray-400 text-sm">No docs available.</p>';
    return;
  }

  const groups = {};
  for (const docPath of docs) {
    const parts = docPath.split('/');
    const group = parts.length > 1 ? parts.slice(0, -1).join('/') : '';
    if (!groups[group]) groups[group] = [];
    groups[group].push(docPath);
  }

  let html = '<h3 class="font-semibold text-sm text-gray-700 dark:text-gray-300 mb-3">Documentation</h3>';
  for (const [group, files] of Object.entries(groups)) {
    if (group) {
      html += `<div class="text-xs font-semibold text-gray-400 dark:text-gray-500 uppercase mt-3 mb-1">${group}</div>`;
    }
    for (const file of files) {
      const name = file.split('/').pop().replace('.md', '');
      const label = name === 'README' ? 'Overview' : name;
      html += `<div class="doc-link px-2 py-1.5 rounded text-sm text-gray-700 dark:text-gray-300" onclick="loadDoc('${file}', this)" data-path="${file}">${label}</div>`;
    }
  }
  sidebar.innerHTML = html;
}

async function loadDoc(path, el) {
  document.querySelectorAll('.doc-link').forEach(e => e.classList.remove('doc-link-active'));
  if (el) el.classList.add('doc-link-active');

  const content = document.getElementById('docs-content');
  try {
    const resp = await fetch('/docs/' + path);
    if (!resp.ok) throw new Error('Not found');
    const md = await resp.text();
    content.innerHTML = marked.parse(md);
  } catch (e) {
    content.innerHTML = `<p class="text-red-500">Failed to load ${path}: ${e.message}</p>`;
  }
}

// ── Downloads page rendering ────────────────────────────────────────────

function renderDownloads(manifest) {
  const page = document.getElementById('page-downloads');
  let html = '<h2 class="text-xl font-bold mb-4">Downloads</h2>';
  html += '<div class="bg-white dark:bg-gray-900 rounded-lg shadow-sm border border-gray-200 dark:border-gray-700 divide-y divide-gray-100 dark:divide-gray-800">';

  html += downloadRow('state.json', '/data/state.json', 'Full devnet state including all endpoints, contracts, and service URLs');

  if (manifest.configs && manifest.configs.length > 0) {
    for (const file of manifest.configs) {
      const desc = file.startsWith('extra-') ? 'Extra deployed contract addresses' : 'Deployed contract addresses';
      html += downloadRow(file, '/data/configs/' + file, desc);
    }
  }

  if (manifest.hasNetworkConfig) {
    html += downloadRow('config.yaml', '/data/network/config.yaml', 'Consensus layer network configuration');
  }

  html += '</div>';
  page.innerHTML = html;
}

function downloadRow(name, href, description) {
  return `<div class="flex items-center justify-between p-4">
    <div>
      <div class="font-medium text-sm">${name}</div>
      <div class="text-xs text-gray-500 dark:text-gray-400">${description}</div>
    </div>
    <a href="${href}" download class="px-3 py-1.5 bg-blue-600 hover:bg-blue-700 dark:bg-blue-700 dark:hover:bg-blue-600 text-white text-sm rounded transition-colors">Download</a>
  </div>`;
}

// ── Init ────────────────────────────────────────────────────────────────

async function init() {
  try {
    const [stateResp, manifestResp] = await Promise.all([
      fetch('/data/state.json'),
      fetch('/data/manifest.json'),
    ]);

    if (!stateResp.ok) throw new Error('Failed to load state.json');

    STATE = await stateResp.json();
    MANIFEST = manifestResp.ok ? await manifestResp.json() : { configs: [], docs: [], hasNetworkConfig: false };

    document.getElementById('loading').classList.add('hidden');
    document.getElementById('page-status').classList.remove('hidden');

    if (MANIFEST.buildTime) {
      document.getElementById('build-time').textContent = 'Built: ' + new Date(MANIFEST.buildTime).toLocaleString();
    }

    renderStatus(STATE);
    renderDocsSidebar(MANIFEST);
    renderDownloads(MANIFEST);
  } catch (e) {
    document.getElementById('loading').classList.add('hidden');
    document.getElementById('error').classList.remove('hidden');
    document.getElementById('error').textContent = 'Failed to load dashboard: ' + e.message;
  }
}

init();
</script>
</body>
</html>
