    el_extra_params: [ --syncmode=full --rpc.allow-unprotected-txs --gcmode=archive --rpc.gascap=100000000 --rpc.txfeecap=0 ]
    el_min_cpu: 0
    el_max_cpu: 0
    el_min_mem: 0
    el_max_mem: 0
    el_volume_size: 51200
    # CL
    cl_type: prysm
    cl_image: ethpandaops/prysm-beacon-chain:glamsterdam-devnet-3
    cl_extra_params: [ ]
    use_separate_vc: true
    vc_type: prysm
    vc_image: ethpandaops/prysm-validator:glamsterdam-devnet-3
    supernode: true
    cl_volume_size: 51200
