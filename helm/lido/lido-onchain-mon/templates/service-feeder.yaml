apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-feeder
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: feeder
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: feeder
  ports:
    - name: http
      port: {{ .Values.feeder.port }}
      targetPort: {{ .Values.feeder.port }}
      protocol: TCP
