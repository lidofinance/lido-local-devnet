apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-nats
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: nats
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: nats
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: nats
    spec:
      containers:
      - name: nats
        image: nats:2.10.29-alpine
        imagePullPolicy: IfNotPresent
        args:
          - "-js"
          - "-sd"
          - "/data/nats"
          - "-m"
          - "8222"
          - "-p"
          - "4222"
        ports:
          - name: client
            containerPort: 4222
            protocol: TCP
          - name: monitor
            containerPort: 8222
            protocol: TCP
        volumeMounts:
          - name: nats-data
            mountPath: /data/nats
        readinessProbe:
          tcpSocket:
            port: 4222
          initialDelaySeconds: 3
          periodSeconds: 5
        livenessProbe:
          tcpSocket:
            port: 4222
          initialDelaySeconds: 10
          periodSeconds: 10
        resources: {}
      volumes:
        - name: nats-data
          emptyDir: {}
