apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-prometheus-config
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: prometheus
data:
  {{- $lidoApp := index .Values "lido-app" }}
  prometheus.yml: |
    global:
      scrape_interval: {{ .Values.prometheus.scrapeInterval | quote }}
      evaluation_interval: {{ .Values.prometheus.evaluationInterval | quote }}
      external_labels:
        monitor: {{ .Values.prometheus.externalLabels.monitor | quote }}
        env: {{ .Values.prometheus.externalLabels.env | quote }}
        source: {{ .Values.prometheus.externalLabels.source | quote }}

    alerting:
      alertmanagers:
        - static_configs:
            - targets:
                - {{ printf "%s-alertmanager:%v" .Release.Name .Values.alertmanager.port | quote }}

    rule_files:
      - /etc/prometheus/rules/common.yml

    scrape_configs:
      - job_name: "prometheus"
        static_configs:
          - targets:
              - {{ printf "localhost:%v" .Values.prometheus.port | quote }}

      - job_name: "ethereum-head-watcher"
        static_configs:
          - targets:
              - {{ printf "%s-app:%v" .Release.Name (int $lidoApp.env.variables.PROMETHEUS_PORT) | quote }}
        relabel_configs:
          - target_label: network
            replacement: {{ $lidoApp.env.variables.NETWORK_NAME | quote }}
