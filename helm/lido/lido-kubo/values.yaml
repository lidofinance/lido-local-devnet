lido-app:
  nameOverride: lido-kubo

  # Number of replicas for the backend deployment
  replicaCount: 1

  deploymentStrategy:
    type: Recreate

  # Image configuration
  image:
    registry: docker.io
    repository: lidofinance/kubo
    tag: "dev"
    pullPolicy: Always
    imagePullSecrets:
      - name: registry-pull-secret

  service:
    type: ClusterIP
    ports:
     - name: http
       port: 8080
       targetPort: 8080
       protocol: TCP
     - name: http-api
       port: 5001
       targetPort: 5001
       protocol: TCP
     - name: swarm-tcp
       port: 4001
       targetPort: 4001
       protocol: TCP
     - name: swarm-udp
       port: 4001
       targetPort: 4001
       protocol: UDP

  # Ingress configuration
  ingress:
    # Enable/disable ingress
    enabled: true
    # Ingress class name
    className: "public"
    # Ingress annotations
    annotations: {}
    # Example annotations:
    # annotations:
    #   nginx.ingress.kubernetes.io/rewrite-target: /
    #   cert-manager.io/cluster-issuer: letsencrypt-prod

    # Ingress hosts configuration
    hosts:
      - host: kubo-api.local
        paths:
          - path: /
            pathType: Prefix
            port: http-api

  # Container command
  command: [ ]

  # Container args
  args: ["daemon", "--migrate=true", "--agent-version-suffix=docker"]

  initCommands:
    - 'if [ ! -f /data/ipfs/config ]; then ipfs init --profile=server; fi'
    - 'if [ -n "${KUBO_SWARM_EXTERNAL_HOST:-}" ]; then ipfs config --json Addresses.AppendAnnounce "[\"/ip4/${KUBO_SWARM_EXTERNAL_HOST}/tcp/${KUBO_SWARM_EXTERNAL_TCP_PORT}\",\"/ip4/${KUBO_SWARM_EXTERNAL_HOST}/udp/${KUBO_SWARM_EXTERNAL_UDP_PORT}/quic-v1\"]"; fi'

  # Environment variables
  env:
    # Static environment variables
    variables:
      CHAIN: ${CHAIN}
      KUBO_SWARM_EXTERNAL_HOST: ""
      KUBO_SWARM_EXTERNAL_TCP_PORT: "32355"
      KUBO_SWARM_EXTERNAL_UDP_PORT: "32355"

  # Resource limits and requests
  resources: { }
  # Example:
  # resources:
  #   limits:
  #     cpu: 500m
  #     memory: 512Mi
  #   requests:
  #     cpu: 250m
  #     memory: 256Mi

  # Node selector
  nodeSelector: { }

  # Tolerations
  tolerations: [ ]

  # Affinity rules
  affinity: { }

  # Security context
  securityContext: { }

  # Pod security context
  podSecurityContext: { }

  # Liveness probe
  livenessProbe:
    httpGet:
      path: /debug/metrics/prometheus
      port: http-api
    initialDelaySeconds: 30
    periodSeconds: 10

  # Readiness probe
  readinessProbe:
    httpGet:
      path: /debug/metrics/prometheus
      port: http-api
    initialDelaySeconds: 5
    periodSeconds: 5

  # Additional labels
  additionalLabels: { }

  # Additional annotations
  additionalAnnotations: { }

  # Persistent Volume Claims configuration
  pvcs:
   - name: ipfs-data
     accessModes:
       - ReadWriteOnce
     size: 16Gi
     mountPath: /data/ipfs

swarmExternalService:
  enabled: true
  type: NodePort
  externalTrafficPolicy: Cluster
  annotations: {}
  labels: {}
  ports:
    - name: swarm-tcp
      port: 4001
      targetPort: 4001
      protocol: TCP
      nodePort: 32355
    - name: swarm-udp
      port: 4001
      targetPort: 4001
      protocol: UDP
      nodePort: 32355
