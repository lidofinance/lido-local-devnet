image:
  repository: prom/prometheus
  tag: v2.54.1
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 9090

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 512Mi

scrapeTargets: []
  # - host: "lido-evm-1:8080"
  #   jobName: evm

# Alert rules content (passed via --set-file alertRules=path/to/rules.yml)
alertRules: ""

# Alertmanager target (e.g. "evm-alertmanager:9093"). Empty = no alertmanager.
alertmanagerUrl: ""
