apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  labels:
    app: {{ .Release.Name }}
data:
  prometheus.yml: |
    global:
      scrape_interval: 10s
      evaluation_interval: 15s
    {{- if .Values.alertmanagerUrl }}
    alerting:
      alertmanagers:
        - static_configs:
            - targets:
                - {{ .Values.alertmanagerUrl }}
    {{- end }}
    {{- if .Values.alertRules }}
    rule_files:
      - /etc/prometheus/rules/*.yml
    {{- end }}
    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets:
              - localhost:9090
      {{- range .Values.scrapeTargets }}
      - job_name: {{ .jobName }}
        metrics_path: /metrics
        static_configs:
          - targets:
              - {{ .host }}
      {{- end }}
