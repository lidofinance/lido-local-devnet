apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-clickhouse
  labels:
    app: {{ .Release.Name }}-clickhouse
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.httpPort }}
      targetPort: 8123
      protocol: TCP
    - name: native
      port: {{ .Values.service.nativePort }}
      targetPort: 9000
      protocol: TCP
  selector:
    app: {{ .Release.Name }}-clickhouse
