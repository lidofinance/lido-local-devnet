# Default values for ClickHouse
image:
  repository: clickhouse/clickhouse-server
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  httpPort: 8123
  nativePort: 9000

resources:
  limits:
    cpu: "2"
    memory: 4Gi
  requests:
    cpu: "0.25"
    memory: 1Gi

persistence:
  enabled: true
  size: 10Gi
  storageClassName: ""
  accessModes:
    - ReadWriteOnce

env:
  CLICKHOUSE_DB: default
