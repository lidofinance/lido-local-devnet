apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
    component: alertmanager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}
      component: alertmanager
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
        component: alertmanager
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap-alertmanager.yaml") . | sha256sum }}
    spec:
      containers:
        - name: alertmanager
          image: "{{ .Values.alertmanager.image.repository }}:{{ .Values.alertmanager.image.tag }}"
          imagePullPolicy: {{ .Values.alertmanager.image.pullPolicy }}
          args:
            - --config.file=/etc/alertmanager/alertmanager.yml
            - --storage.path=/alertmanager
            - --log.format=json
          ports:
            - name: http
              containerPort: {{ .Values.alertmanager.port }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          {{- with .Values.alertmanager.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager/alertmanager.yml
              subPath: alertmanager.yml
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{ .Release.Name }}-config
